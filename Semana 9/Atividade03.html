<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Média Escolar</title>
    <style>
        /* Reset total para remover qualquer estilo padrão */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            background-color: #ffffff; /* Fundo branco puro */
            display: flex;
            justify-content: center;
            padding-top: 40px;
        }

        .container {
            border: 1px solid #000; /* Borda preta fina e quadrada */
            width: 320px;
            padding: 20px;
        }

        h1 {
            font-size: 18px;
            margin-bottom: 20px;
            text-transform: uppercase;
            border-bottom: 1px solid #000;
            padding-bottom: 10px;
        }

        .campo {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        input {
            padding: 8px;
            border: 1px solid #000; /* Input quadrado */
            font-size: 14px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #000; /* Botão preto sólido */
            color: #fff;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
        }

        #resultado {
            margin-top: 20px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            border: 1px dashed #000; /* Área de resultado com borda tracejada */
            padding: 10px;
            min-height: 40px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Média Escolar</h1>

        <div class="campo">
            <label>NOME DO ALUNO</label>
            <input type="text" id="nome">
        </div>

        <div class="campo">
            <label>NOTA 1</label>
            <input type="number" id="nota1" step="0.1">
        </div>

        <div class="campo">
            <label>NOTA 2</label>
            <input type="number" id="nota2" step="0.1">
        </div>

        <div class="campo">
            <label>NOTA 3</label>
            <input type="number" id="nota3" step="0.1">
        </div>

        <button id="calcular">CALCULAR</button>

        <div id="resultado"></div>
    </div>

    <script>
        const nota1 = document.getElementById('nota1');
        const nota2 = document.getElementById('nota2');
        const nota3 = document.getElementById('nota3');
        const botaoMedia = document.getElementById('calcular');
        const resultado = document.getElementById('resultado');

        botaoMedia.addEventListener('click', () => {
            let n1 = Number(nota1.value);
            let n2 = Number(nota2.value);
            let n3 = Number(nota3.value);

            let media = (n1 + n2 + n3) / 3;

            // Limpa estilo anterior
            resultado.style.backgroundColor = "transparent";

            if (media >= 7) {
                resultado.innerHTML = "APROVADO (" + media.toFixed(1) + ")";
                resultado.style.color = "green";
            } else if (media >= 4) {
                resultado.innerHTML = "RECUPERAÇÃO (" + media.toFixed(1) + ")";
                resultado.style.color = "orange";
            } else {
                resultado.innerHTML = "REPROVADO (" + media.toFixed(1) + ")";
                resultado.style.color = "red";
            }
        });
    </script>

</body>

</html>
