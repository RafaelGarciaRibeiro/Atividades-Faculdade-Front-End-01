<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Bank - Simulação</title>
    <style>
        /* Reset para design limpo e reto */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            background-color: #ffffff; /* Fundo branco puro */
            display: flex;
            justify-content: center;
            padding-top: 40px;
        }

        .container {
            border: 1px solid #000; /* Borda preta simples */
            width: 320px;
            padding: 20px;
        }

        h1 {
            font-size: 18px;
            margin-bottom: 20px;
            text-align: left;
            text-transform: uppercase;
            border-bottom: 2px solid #000;
            padding-bottom: 5px;
        }

        .campo {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        input, select {
            padding: 8px;
            border: 1px solid #000; /* Elementos quadrados */
            font-size: 14px;
            outline: none;
            background: #fff;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #000; /* Botão preto sólido */
            color: #fff;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
        }

        #resultado {
            margin-top: 20px;
            font-size: 13px;
            line-height: 1.8;
            padding-top: 10px;
            border-top: 1px dashed #000; /* Divisor simples */
        }

        .total-destaque {
            font-weight: 900;
            font-size: 15px;
            margin-top: 5px;
            display: block;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Infinity Bank</h1>

        <div class="campo">
            <label>Valor da compra</label>
            <input type="number" id="valor" step="0.01">
        </div>

        <div class="campo">
            <label>Bandeira</label>
            <select id="bandeira">
                <option value="visa">Visa</option>
                <option value="master">Master</option>
                <option value="elo">Elo</option>
            </select>
        </div>

        <div class="campo">
            <label>Parcelas</label>
            <input type="number" id="parcelas">
        </div>

        <button onclick="calcular()">Calcular</button>

        <div id="resultado"></div>
    </div>

    <script>
        function calcular() {
            const valor = Number(document.getElementById("valor").value);
            const bandeira = document.getElementById("bandeira").value;
            const parcelas = Number(document.getElementById("parcelas").value);

            if (!valor || !parcelas) {
                document.getElementById("resultado").innerHTML = "Preencha todos os campos.";
                return;
            }

            let taxa = 0;
            switch (bandeira) {
                case "visa": taxa = valor * 0.02; break;
                case "master": taxa = valor * 0.0185; break;
                case "elo": taxa = valor * 0.03; break;
            }

            let juros = valor * (0.0035 * parcelas);
            let taxaMensal = 12.50 * parcelas;
            let total = valor + taxa + juros + taxaMensal;
            let valorParcela = total / parcelas;

            document.getElementById("resultado").innerHTML =
                "TAXA BANDEIRA: R$ " + taxa.toFixed(2) + "<br>" +
                "JUROS: R$ " + juros.toFixed(2) + "<br>" +
                "TAXA MENSAL: R$ " + taxaMensal.toFixed(2) + "<br>" +
                "<span class='total-destaque'>TOTAL: R$ " + total.toFixed(2) + "</span>" +
                "<span class='total-destaque'>PARCELA: R$ " + valorParcela.toFixed(2) + "</span>";
        }
    </script>

</body>

</html>
