<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de CPF</title>
    <style>
        /* Reset para evitar variações entre navegadores */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff; /* Fundo branco puro */
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        .container {
            border: 1px solid #000; /* Borda preta simples */
            width: 300px;
            padding: 20px;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 15px;
            text-align: left;
        }

        .campo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #000;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #eee; /* Cinza claro básico */
            border: 1px solid #000;
            cursor: pointer;
            font-weight: bold;
        }

        #resultado {
            margin-top: 15px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Validador de CPF</h1>

        <div class="campo">
            <label for="cpf">Digite o CPF:</label>
            <input type="text" id="cpf" maxlength="14">
        </div>

        <button id="btn-validar">VALIDAR</button>

        <p id="resultado"></p>
    </div>

    <script>
        const inputCpf = document.getElementById("cpf");
        const botao = document.getElementById("btn-validar");
        const resultado = document.getElementById("resultado");

        botao.addEventListener("click", function () {
            let cpf = inputCpf.value.replace(/\D/g, "");

            if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) {
                resultado.innerText = "CPF inválido";
                resultado.style.color = "red";
                return;
            }

            let soma = 0;
            let peso = 10;
            for (let i = 0; i < 9; i++) {
                soma += Number(cpf[i]) * peso--;
            }
            let digito1 = (soma * 10) % 11;
            if (digito1 === 10) digito1 = 0;

            soma = 0;
            peso = 11;
            for (let i = 0; i < 10; i++) {
                soma += Number(cpf[i]) * peso--;
            }
            let digito2 = (soma * 10) % 11;
            if (digito2 === 10) digito2 = 0;

            if (digito1 == cpf[9] && digito2 == cpf[10]) {
                resultado.innerText = "CPF válido";
                resultado.style.color = "black";
            } else {
                resultado.innerText = "CPF inválido";
                resultado.style.color = "red";
            }
        });
    </script>
</body>

</html>
